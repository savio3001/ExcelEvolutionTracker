[project]
name = "excel-evo-tracker"
version = "0.1.0"
description = "Detect structural drift across monthly XLSB template files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0",
    "scipy>=1.11",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
excel-evo-tracker = "excel_evo_tracker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excel_evo_tracker"]